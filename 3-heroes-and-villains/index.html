<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heroes and villains</title>
    <link rel="icon" href="./img/logo.webp" type="image/webp">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/styles.css">
    <script src="https://kit.fontawesome.com/cb00f18dc9.js" crossorigin="anonymous"></script>
</head>
<body>
    <main>
        <div class="entry-form">
            <div class="form-head">
                <img src="./img/form.jpeg">
            </div>
            <div class="form-body">
                <h1>HEROES AND VILLAINS</h1>
                <form action="game.html">
                    <div class="item-form">
                        <label for="nick"><i class="fa-solid fa-user"></i> Nick</label>
                        <input type="text" id="nick" name="nick" minlength="2" max="64" required>
                    </div>
                    <div class="item-form">
                        <label for="difficulty"><i class="fa-solid fa-gauge"></i> Difficulty</label>
                        <select id="difficulty" name="difficulty" required>
                            <option value="easy">Easy</option>
                            <option value="hard">Hard</option>
                        </select>
                    </div>
                    <div class="item-form">
                        <label for="avatar"><i class="fa-solid fa-face-meh-blank"></i> Avatar</label>
                        <div id="avatar-section">
                            <div id="avatar">
                                <img src="./img/avatars/trunks.png" id="avatar-img">
                            </div>
                            <div class="avatar-grid">
                                <div class="avatar-item">
                                    <img src="./img/avatars/trunks.png" class="avatar-img-item" draggable="true">
                                </div>
                                <div class="avatar-item">
                                    <img src="./img/avatars/android-18.png" class="avatar-img-item" draggable="true">
                                </div>
                                <div class="avatar-item">
                                    <img src="./img/avatars/muten-roshi.png" class="avatar-img-item" draggable="true">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="submit-container">
                        <button type="submit">PLAY</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
