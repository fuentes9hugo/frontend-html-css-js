<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heroes and villains - Game</title>
    <link rel="icon" href="./img/logo.webp" type="image/webp">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/gameStyles.css">
    <script src="https://kit.fontawesome.com/cb00f18dc9.js" crosszorigin="anonymous"></script>
    <script type="module" src="js/game.js"></script>
</head>
<body>
    <main>
        <div id="contenedorJuego">
            <div id="juego">
                <!-- Draw game panel automatically -->
                <!-- <div class="containerItem"><div class="item"></div></div> -->
            </div>
            <div id="juegoAcabado">
                <button id="nuevaPartida">ANOTHER GAME</button>
            </div>
            <div id="tituloJuego">
                <p>Heroes and Villains</p>
            </div>
        </div>
        <div id="contenedorUsuario">
            <form id="form_entrada" action="juego.html">
                <div class="itemform">
                    <img src="./img/avatars/trunks.png" width="26" id="avatarImg">
                    <input type="text" id="nick" value="nick" readonly>
                </div>
                <div class="itemform">
                    <label for="puntuacion"><i class="fa-solid fa-gauge"></i> difficulty</label>
                    <input type="text" id="puntuacion" value="easy" class="inputJuego" readonly>
                </div>
                <div class="itemform">
                    <label for="tmpo"><i class="fa-solid fa-hashtag"></i> number of cards</label>
                    <input type="text" id="tmpo" value="four" class="inputJuego" readonly>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
