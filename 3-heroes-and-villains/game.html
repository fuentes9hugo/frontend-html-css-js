<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heroes and villains - Game</title>
    <link rel="icon" href="./img/logo.webp" type="image/webp">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/gameStyles.css">
    <script src="https://kit.fontawesome.com/cb00f18dc9.js" crosszorigin="anonymous"></script>
    <script type="module" src="js/game.js"></script>
</head>
<body>
    <main>
        <div id="contenedor-juego">
            <div id="juego">
                <!-- Draw game panel automatically -->
                <!-- <div class="container-item"><img class="" src="./img/cards/card.png"></div> -->
            </div>
            <div id="juego-acabado">
                <button id="nueva-partida">ANOTHER GAME</button>
            </div>
            <div id="titulo-juego">
                <p>Heroes and Villains</p>
            </div>
        </div>
        <div id="contenedor-usuario">
            <form id="form-entrada" action="game.html">
                <div class="itemform">
                    <img src="./img/avatars/trunks.png" width="26" id="avatar-img">
                    <input type="text" id="nick" value="nick" readonly>
                </div>
                <div class="itemform">
                    <label for="difficulty"><i class="fa-solid fa-gauge"></i> card's show tieme</label>
                    <input type="text" id="difficulty" value="MEDIUM" class="input-juego" readonly>
                </div>
                <div class="itemform">
                    <label for="cards-num"><i class="fa-solid fa-hashtag"></i> number of cards</label>
                    <input type="text" id="cards-num" value="sixteen" class="input-juego" readonly>
                </div>
                <div class="itemform">
                    <label for="limit"><i class="fa-solid fa-arrows-up-to-line"></i> remaining coins</label>
                    <input type="text" id="limit" value="24" class="input-juego" readonly>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
